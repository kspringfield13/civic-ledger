# Optional local services. SQLite prototype mode needs none of this.
# Usage: docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civic_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-civic_ledger}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civic}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
